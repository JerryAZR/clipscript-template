name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Remotion's headless browser lands in node_modules/.remotion, which
      # npm ci wipes - restore it after install to avoid a ~150MB download
      - uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck & lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Render smoke test
        run: npm run test:smoke
        timeout-minutes: 15
